<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD // FAST-BREACH (SKY BLUE)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');

        :root {
            --sky-blue: #00c8ff;
            --sky-glow: rgba(0, 200, 255, 0.7);
            --bg-deep: #021018;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--sky-blue);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-shadow: 0 0 8px var(--sky-glow), 0 0 2px rgba(0, 200, 255, 0.9);
            transition: opacity 0.5s ease;
        }

        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 0; 
            opacity: 0.2; 
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitching { animation: glitch 0.1s infinite; }

        .container {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 380px;
            background: rgba(0, 20, 35, 0.9);
            border: 2px solid var(--sky-blue);
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.25);
            backdrop-filter: blur(1px);
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            background: var(--sky-blue);
            color: #000;
            text-shadow: none;
        }

        .visual-core {
            text-align: center;
            margin-bottom: 20px;
        }

        .percentage {
            font-size: 4rem;
            font-weight: 800;
            font-style: italic;
            color: var(--sky-blue);
        }

        .binary-stream {
            font-size: 0.7rem;
            color: var(--sky-blue);
            opacity: 0.5;
            height: 1.2rem;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .log-box {
            height: 90px;
            font-size: 0.7rem;
            border-top: 1px solid rgba(0, 200, 255, 0.35);
            padding-top: 10px;
            margin-bottom: 15px;
            color: var(--sky-blue);
            overflow-y: auto;
        }

        .log-box div {
            border-bottom: 1px solid rgba(0, 200, 255, 0.1);
        }

        .status-pill {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--sky-blue);
            text-align: center;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--sky-blue);
            transition: all 0.2s ease;
        }

        .complete {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 40px #ffffff, 0 0 20px var(--sky-blue);
            border-color: #ffffff;
            text-shadow: none;
        }

        /* subtle sky-blue pulse for canvas rain */
        @keyframes skyPulse {
            0% { opacity: 0.15; }
            50% { opacity: 0.25; }
            100% { opacity: 0.15; }
        }
        canvas {
            animation: skyPulse 4s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container" id="panel">
        <div class="header"><h1>RD PANEL 2.0</h1></div>
        <div class="visual-core">
            <div class="binary-stream" id="binary"></div>
            <div class="percentage" id="pct">0%</div>
        </div>
        <div class="log-box" id="log"></div>
        <div class="status-pill" id="st">RUNNING_EXPLOIT</div>
    </div>

    <script>
        // ========== SKY BLUE RAIN EFFECT ==========
        const c = document.getElementById('canvas'), ctx = c.getContext('2d');
        c.width = window.innerWidth; 
        c.height = window.innerHeight;
        const drops = Array(Math.floor(c.width / 15)).fill(1);
        
        function draw() {
            ctx.fillStyle = "rgba(2, 16, 24, 0.15)"; // deep dark blue background wash
            ctx.fillRect(0, 0, c.width, c.height);
            
            // Sky blue color: #00c8ff
            ctx.fillStyle = "#00c8ff"; 
            ctx.font = "15px 'JetBrains Mono', monospace";
            
            drops.forEach((y, i) => {
                // Using random characters from a wider range to look like code rain
                const char = String.fromCharCode(0x30A0 + Math.random() * 96); // Katakana + ASCII mix
                ctx.fillText(char, i * 15, y * 15);
                
                if (y * 15 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 20);

        // ========== TIMING & SCRIPT (EXACT SAME AS ORIGINAL, ONLY COLORS CHANGED) ==========
        const script = [
            '> BYPASSING...', 
            '> INJECTING...', 
            '> DECRYPTING...', 
            '> ESCALATING...', 
            '> WIPING...', 
            '> DONE.'
        ];
        
        let prog = 0, idx = 0;
        const panel = document.getElementById('panel'), 
              pct = document.getElementById('pct'), 
              log = document.getElementById('log'), 
              st = document.getElementById('st'), 
              bin = document.getElementById('binary');

        // ═══════════════════════════════════════════════════════════
        // EXACT SAME TIMING AS KK PANEL
        // Total: 3700ms (3.7 seconds)
        // ═══════════════════════════════════════════════════════════
        const INITIAL_DELAY = 400;      // 0.4s
        const LOADING_TIME = 2000;      // 2.0s
        const UPDATE_INTERVAL = 20;     // 20ms
        const POST_WAIT = 800;          // 0.8s
        const FADE_TIME = 500;          // 0.5s
        
        const INCREMENT = 100 / (LOADING_TIME / UPDATE_INTERVAL); // = 1.0

        function update() {
            if (prog < 100) {
                prog += INCREMENT;
                if (prog > 100) prog = 100;
                
                const displayPct = Math.floor(prog);
                pct.innerText = displayPct + "%";
                
                // Generate random binary string (same length as original 40 chars)
                bin.innerText = Math.random().toString(2).substr(2, 40);
                
                if (prog > 70) panel.classList.add('glitching');

                const threshold = (100 / script.length) * idx;
                if (prog >= threshold && idx < script.length) {
                    const l = document.createElement('div');
                    l.innerText = script[idx];
                    log.appendChild(l);
                    
                    // Update status pill with current action
                    st.innerText = script[idx].replace('> ', '');
                    
                    // Keep log box scrolled to bottom
                    log.scrollTop = log.scrollHeight;
                    
                    // Remove old lines if more than 5 (same as original)
                    if (log.childNodes.length > 5) log.removeChild(log.firstChild);
                    idx++;
                }
                
                setTimeout(update, UPDATE_INTERVAL);
            } else {
                // ========== COMPLETE SEQUENCE ==========
                st.innerText = "SYSTEM_OWNED";
                st.classList.add('complete');
                
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = `opacity ${FADE_TIME/1000}s ease`;
                    
                    setTimeout(() => {
                        // Redirect to main-panel.html (same as original)
                        window.location.href = 'main-panel.html';
                    }, FADE_TIME);
                    
                }, POST_WAIT);
            }
        }
        
        // Start the sequence after initial delay
        setTimeout(update, INITIAL_DELAY);
    </script>
</body>
</html>

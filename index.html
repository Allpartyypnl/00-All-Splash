<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK // cold-boot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@600&display=swap');

        :root{
            --ice: #e6d2d6;      /* muted tint of #7c2030 */
            --frost: #7c2030;    /* your colour */
            --void: #05070a;
            --grid: rgba(124, 32, 48, .06);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            height:100vh;
            background:var(--void);
            color:var(--ice);
            font-family:'Space Mono',monospace;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        /* ---------- background ---------- */
        .grid{
            position:fixed;
            inset:0;
            background:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size:30px 30px;
            z-index:1;
        }
        .scan{
            position:fixed;
            inset:0;
            background:linear-gradient(0deg, transparent 48%, rgba(124,32,48,.03) 50%, transparent 52%);
            background-size:100% 6px;
            animation:scan 4s linear infinite;
            z-index:2;
        }
        @keyframes scan{to{background-position:0 100vh}}

        /* ---------- card ---------- */
        .card{
            position:relative;
            z-index:10;
            width:clamp(300px, 90vw, 500px);
            border:1px solid var(--frost);
            background:rgba(5,7,10,.65);
            backdrop-filter:blur(4px);
            padding:2.2rem 2.5rem;
            box-shadow:0 0 30px rgba(124,32,48,.25);
        }
        .card h1{
            font-family:'Inter',sans-serif;
            font-size:1.75rem;
            letter-spacing:.1em;
            margin-bottom:1.2rem;
            color:var(--frost);
            text-shadow:0 0 8px var(--frost);
        }
        .line{
            height:1.3rem;
            overflow:hidden;
            margin-bottom:.9rem;
        }
        .bar{
            height:3px;
            background:rgba(124,32,48,.15);
            overflow:hidden;
        }
        .bar div{
            height:100%;
            width:0;
            background:var(--ice);
            box-shadow:0 0 8px var(--frost);
            transition:width .1s linear;
        }
        .status{
            margin-top:.6rem;
            font-size:.75rem;
            opacity:.7;
        }

        /* ---------- rain ---------- */
        canvas{
            position:fixed;
            inset:0;
            z-index:0;
            opacity:.18;
            pointer-events:none;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="scan"></div>
    <canvas id="rain"></canvas>

    <div class="card">
        <h1>KK</h1>
        <div class="line" id="txt">&gt; cold-boot sequence…</div>
        <div class="bar"><div id="prog"></div></div>
        <div class="status" id="st">status: handshake</div>
    </div>

    <script>
        /* ---------- binary rain ---------- */
        const c = document.getElementById('rain'),
              x = c.getContext('2d');
        let cols = 0, drops = [];
        function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/18);drops=Array(cols).fill(1);}
        resize(); addEventListener('resize',resize);
        function rain(){
            x.fillStyle='rgba(5,7,10,.05)';
            x.fillRect(0,0,c.width,c.height);
            x.fillStyle='#7c2030';                 // your colour
            x.font='14px Space Mono';
            for(let i=0;i<drops.length;i++){
                const r=Math.random()>.5?'1':'0';
                x.fillText(r,i*18,drops[i]*18);
                if(drops[i]*18>c.height&&Math.random()>.975) drops[i]=0;
                drops[i]++;
            }
        }
        setInterval(rain,45);

        /* ---------- boot simulation ---------- */
        const script = [
            {t:'> decrypting volume…', s:'cipher: AES-256-XTS'},
            {t:'> loading kernel…',    s:'module: KK.os/v2.1'},
            {t:'> syncing nodes…',     s:'peers: 12'},
            {t:'> mounting user…',     s:'uid: 0x0001'},
            {t:'> ready',              s:'entering session'}
        ];
        const txt = document.getElementById('txt'),
              st  = document.getElementById('st'),
              bar = document.getElementById('prog');
        let idx = 0;
        function boot(){
            const start = performance.now(),
                  dur   = 4800 + Math.random()*1200;
            (function frame(){
                const p = Math.min((performance.now()-start)/dur,1);
                bar.style.width = (p*100).toFixed(2)+'%';
                if(p>=.18&&idx===0) next(0);
                if(p>=.36&&idx===1) next(1);
                if(p>=.54&&idx===2) next(2);
                if(p>=.72&&idx===3) next(3);
                if(p>=.90&&idx===4) next(4);
                if(p<1) return requestAnimationFrame(frame);
                setTimeout(()=>location.href='main-panel.html',400);
            })();
        }
        function next(i){txt.textContent=script[i].t; st.textContent='status: '+script[i].s; idx++;}
        boot();
    </script>
</body>
</html>

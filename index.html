<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Suspended</title>
    <style>
        /* Blinking background animation — unchanged */
        @keyframes blinkBackground {
            0% { background-color: black; }
            50% { background-color: darkred; }
            100% { background-color: black; }
        }

        body {
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            animation: blinkBackground 2s infinite;
        }
        
        .container {
            max-width: 600px;
            padding: 0 1rem;
        }

        .heading {
            color: red;
        }

        /* Big green text for "Contact Your Developer" */
        .contact-highlight {
            font-size: 1.5rem;        /* noticeably big */
            color: #00cc44;           /* vivid green */
            font-weight: bold;
            margin: 0.5rem 0 0.2rem;  /* slight spacing, keep layout similar */
            letter-spacing: 0.5px;
        }

        /* All other styles are untouched — no button, no footer, same as original */
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">App Suspended</h1>
        <p>Sorry For Inconvenience Please Contact Your Developer.</p>
        <!-- "Contact Your Developer" — now big and green, exactly as requested -->
        <p class="contact-highlight">Contact Your Developer</p>
        <!-- WhatsApp button removed. "Powered by SK Admin" removed. All else unchanged. -->
    </div>
</body>
</html>

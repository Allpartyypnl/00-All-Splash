<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD // FAST-BREACH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');

        :root {
            --matrix-green: #00ff41;
            --bg: #030a03;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--matrix-green);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 0; opacity: 0.2; }

        /* CRT Glitch Effect */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitching { animation: glitch 0.1s infinite; }

        .container {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 380px;
            background: rgba(0, 10, 0, 0.9);
            border: 2px solid var(--matrix-green);
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            background: var(--matrix-green);
            color: #000;
        }

        .visual-core {
            text-align: center;
            margin-bottom: 20px;
        }

        .percentage {
            font-size: 4rem;
            font-weight: 800;
            font-style: italic;
        }

        .binary-stream {
            font-size: 0.7rem;
            color: var(--matrix-green);
            opacity: 0.4;
            height: 1.2rem;
            overflow: hidden;
        }

        .log-box {
            height: 90px;
            font-size: 0.7rem;
            border-top: 1px solid rgba(0, 255, 65, 0.3);
            padding-top: 10px;
            margin-bottom: 15px;
        }

        .status-pill {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--matrix-green);
            text-align: center;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .complete {
            background: #fff;
            color: #000;
            box-shadow: 0 0 40px #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container" id="panel">
        <div class="header"><h1>RD PANEL</h1></div>
        <div class="visual-core">
            <div class="binary-stream" id="binary"></div>
            <div class="percentage" id="pct">0%</div>
        </div>
        <div class="log-box" id="log"></div>
        <div class="status-pill" id="st">RUNNING_EXPLOIT</div>
    </div>

    <script>
        // Rain Effect
        const c = document.getElementById('canvas'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const drops = Array(Math.floor(c.width/15)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = "#0F0"; ctx.font = "15px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random()*128), i*15, y*15);
                if(y*15 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 20);

        // Fast Loading
        const script = ['> BYPASSING...', '> INJECTING...', '> DECRYPTING...', '> ESCALATING...', '> WIPING...', '> DONE.'];
        let prog = 0, idx = 0;
        const panel = document.getElementById('panel'), pct = document.getElementById('pct'), 
              log = document.getElementById('log'), st = document.getElementById('st'), 
              bin = document.getElementById('binary');

        function update() {
            if (prog <= 100) {
                pct.innerText = Math.floor(prog) + "%";
                bin.innerText = Math.random().toString(2).substr(2, 40);
                
                if (prog > 70) panel.classList.add('glitching');

                if (prog >= (100/script.length)*idx && idx < script.length) {
                    const l = document.createElement('div');
                    l.innerText = script[idx];
                    log.appendChild(l);
                    st.innerText = script[idx].replace('> ', '');
                    if(log.childNodes.length > 5) log.removeChild(log.firstChild);
                    idx++;
                }
                prog += 2.5; // High speed increment
                setTimeout(update, 25);
            } else {
                st.innerText = "SYSTEM_OWNED";
                st.classList.add('complete');
                setTimeout(() => {
                    document.body.style.background = "#fff";
                    document.body.style.opacity = "0";
                    document.body.style.transition = "0.4s";
                    setTimeout(() => window.location.href = 'main-panel.html', 400);
                }, 400);
            }
        }
        update();
    </script>
</body>
</html>
